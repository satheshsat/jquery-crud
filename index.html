<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern User Management | CRUD</title>
    <meta name="description" content="A premium CRUD application built with jQuery and Bootstrap.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container py-5 content-wrapper">
        <header class="text-center mb-5 fade-in-up">
            <h1 class="display-4 fw-bold gradient-text">User Management</h1>
            <p class="text-muted fs-5">Manage your team members with style and efficiency</p>
        </header>

        <div class="row g-4">
            <!-- Form Section -->
            <div class="col-lg-4 slide-in-left">
                <div class="glass-card p-4">
                    <h4 class="mb-4 d-flex align-items-center gap-2" id="formTitle">
                        <i class="fa-solid fa-user-plus text-primary"></i>
                        <span>Add New User</span>
                    </h4>
                    
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        
                        <div class="mb-3 form-floating">
                            <input type="text" class="form-control glass-input" id="firstName" placeholder="First Name" required>
                            <label for="firstName">First Name</label>
                        </div>
                        
                        <div class="mb-3 form-floating">
                            <input type="text" class="form-control glass-input" id="lastName" placeholder="Last Name" required>
                            <label for="lastName">Last Name</label>
                        </div>
                        
                        <div class="mb-3 form-floating">
                            <input type="email" class="form-control glass-input" id="email" placeholder="Email Address" required>
                            <label for="email">Email Address</label>
                        </div>
                        
                        <div class="mb-4 form-floating">
                            <select class="form-select glass-input" id="role" required>
                                <option value="" disabled selected>Select a role...</option>
                                <option value="Admin">Administrator</option>
                                <option value="Editor">Editor</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                            <label for="role">User Role</label>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1 submit-btn rounded-pill" id="saveBtn">
                                <i class="fa-solid fa-paper-plane me-2"></i> Save User
                            </button>
                            <button type="button" class="btn btn-outline-secondary rounded-pill d-none" id="cancelBtn">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table Section -->
            <div class="col-lg-8 slide-in-right">
                <div class="glass-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="m-0 d-flex align-items-center gap-2">
                            <i class="fa-solid fa-users text-info"></i>
                            User Directory
                        </h4>
                        <div class="search-box">
                            <i class="fa-solid fa-search search-icon"></i>
                            <input type="text" id="searchInput" class="form-control glass-input rounded-pill ps-5" placeholder="Search users...">
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table custom-table align-middle">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- Data will be populated here by jQuery -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="emptyState" class="text-center py-5 text-muted d-none">
                        <i class="fa-solid fa-folder-open fs-1 mb-3 opacity-50"></i>
                        <p class="fs-5">No users found. Add some data!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Custom App Logic -->
    <script src="app.js"></script>
</body>
</html>
